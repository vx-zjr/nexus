summary: 生于台北。前交通部长（2017–2021）、劳工部长（2001–2009）。其父赵锡成创办的福茂集团（Foremost）大量船舶在中国国有船厂建造并获中国国有银行融资；纽时 2019 调查及交通部监察长 2021 报告关注其利用职务为家族企业造势。
