summary: 明天系（明天控股）创始人，被视为为多个权贵家族打理资产的“白手套”。纽时 2014 年报道：彭博披露习家财富后，齐桥桥、邓家贵夫妇将一家投资公司的股份出售给肖建华创办的公司（肖本人对纽时承认曾帮习家“处置资产”，并称习家亲属未从中获利）。2017-01 在香港四季酒店被带回内地，2022-08 以非法吸收公众存款、操纵证券期货市场等罪被判 13 年，明天集团被罚 550 亿元。
