# 身份裁决：处理导入层之间的重复实体与“疑似重复”误报。
#   sameAs       → 声明同一实体，编译时强制合并（规范 id 取本文件中的 id）
#   distinctFrom → 声明不是同一人，消除 possible-duplicate 警告
# 新增裁决前请先用 `npm run ctos -- show <id>` 对比两边的生年、简介与外部 ID。
