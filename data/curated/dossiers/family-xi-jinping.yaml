head: xi-jinping
summary: |-
  习仲勋家族。习近平本人未被发现直接持有资产，但彭博 2012 年调查显示其姐齐桥桥一家控制资产至少 3.76 亿美元（未计入的上市公司股权等另计）；ICIJ 2014 离岸解密显示姐夫邓家贵持有 BVI 公司。
  纠正 zhao 数据：柯玲玲为前妻（1979 年结婚、约 1982 年离婚）；“习明泽—梁治中”婚姻为网络传闻，降级为 rumor。
