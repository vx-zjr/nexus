summary: |-
  习近平在福建（1985–2002）、浙江（2002–2007）、上海（2007）及中央党校（2007–2013）任职期间结识、提拔的干部构成二十大后最高层的主体。
  “之江新军”指浙江时期旧部（李强、蔡奇、陈敏尔、黄坤明等）；“闽江旧部”指福建时期旧部（何立峰、蔡奇、黄坤明等）。
  注意：派系归属是分析性判断，可信度为“报道”，以 Brookings 李成等研究为主要依据。
