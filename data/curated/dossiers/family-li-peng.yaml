summary: 李鹏为周恩来夫妇养子（烈士遗孤）。子李小鹏历任华能集团总经理、山西省长、交通运输部部长；女李小琳长期掌管中国电力投资旗下上市公司，被称为“电力女王”。ICIJ 2014 离岸解密显示李小琳曾持有两家 BVI 公司股权。
