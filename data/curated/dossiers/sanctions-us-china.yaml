id: sanctions-us-china
kind: case
name: 中美互相制裁（官员层面）
names:
  en: US–China official sanctions
country:
- US
- CN
summary: |-
  美方：2020-07 依《全球马格尼茨基法》制裁新疆官员（陈全国等）；2020-08 依第 13936 号行政令制裁林郑月娥、李家超、夏宝龙、骆惠宁、张晓明等 11 人。
  中方：2020-07 反制卢比奥、克鲁兹等；2020-08 再反制卢比奥等 11 名美国人；2021-01-20 制裁蓬佩奥、纳瓦罗、奥布莱恩、博尔顿、班农等 28 名特朗普政府官员（本人及家属禁止入境、关联企业禁止与华往来）。
  值得注意：被中方制裁的卢比奥 2025 年起出任国务卿；被美方制裁的李家超 2022 年起任香港特首。
