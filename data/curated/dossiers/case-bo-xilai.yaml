summary: 2012 年王立军出逃美领馆，揭出谷开来毒杀英国商人尼尔·伍德；薄熙来随后被免去重庆市委书记、政治局委员职务，2013-09 以受贿、贪污、滥用职权罪被判无期徒刑。谷开来以故意杀人罪被判死缓。
