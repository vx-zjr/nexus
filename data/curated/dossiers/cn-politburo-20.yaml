summary: |-
  2022-10 产生，原 24 人（常委 7 人）。截至 2026-10 已有 3 人落马（何卫东、马兴瑞、张又侠），现为 21 人。
  二十届五中全会定于 2026-10-26 至 29 召开，外界关注是否增补政治局委员（传胡春华、张升民等）。外圈为第二十届中央军委中非政治局委员的成员。
