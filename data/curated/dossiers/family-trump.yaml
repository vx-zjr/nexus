summary: |-
  第一代：Fred Trump（纽约地产）。第二代：Donald Trump。第三代：Don Jr.、Ivanka、Eric、Tiffany、Barron。
  姻亲网络：库什纳家族（Jared、Charles 驻法大使、Josh/Thrive Capital）、布洛斯家族（Massad 任非洲事务高级顾问）、Lara Trump（RNC 前联合主席）。
  家族生意：Trump Organization、Trump Media（DJT）、World Liberty Financial（加密货币，家族持股约 60%）、Affinity Partners（库什纳）。
