id: case-pla-purge
kind: case
name: 解放军高层清洗（2023–2026）
names:
  en: PLA leadership purge 2023–2026
country: CN
head: zhang-shengmin
summary: |-
  2023 年火箭军与装备系统高层被清洗（李尚福、魏凤和 2024-06 被开除党籍）；2024-11 苗华停职；2025-10-17 国防部宣布何卫东、苗华等 9 名上将被开除党籍军籍（二十届四中全会前）；2026-01 军委第一副主席张又侠、联参参谋长刘振立被立案审查，2026-09-21 被开除党籍军籍。
  至此第二十届中央军委原 7 人中仅习近平与张升民（军委纪委书记，2025-10 升任副主席）未落马。张升民主导军内纪检。
